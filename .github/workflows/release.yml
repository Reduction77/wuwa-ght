name: 发布 Release（首个版本自动发一次）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 创建 v1.0.0（已存在则跳过）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 已存在，跳过"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag v1.0.0
          git push origin v1.0.0
          gh release create v1.0.0 --title "v1.0.0 首个版本" --notes-file RELEASE_NOTES.md

